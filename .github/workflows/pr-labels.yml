name: PR Label

on:
  pull_request:
    types: [opened]

permissions:
  models: read
  contents: write
  pull-requests: write

jobs:
  classify:
    name: Classify PR
    runs-on: ubuntu-latest
    steps:
      - name: PR impact specified
        uses: NaughtyIshmael/ai-labeler@v1.0.1
        with:
          count: 1
          labels: 'bug, enhancement, documentation, dependencies'
